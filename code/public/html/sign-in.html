<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Sign in · Finpulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../css/sign-in.css">
</head>
<body>
  <header class="top">
    <span class="logo">Finpulse</span>
    <p class="help">Trouble signing in? <a href="#" id="support">Contact support</a></p>
  </header>

  <main class="content">
    <form class="card" id="signInForm" novalidate>
      <div class="heading">
        <h1>Sign in</h1>
        <p>Use the work email your company registered.</p>
      </div>

      <div class="fields">
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="name@fin.company" required>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" id="forgot">Forgot password?</a>
          </div>
          <div class="input-box">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="show" id="showPassword">Show</button>
          </div>
        </div>

        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          <span>Remember me on this computer for 30 days</span>
        </label>

        <p class="message" id="message" role="alert"></p>
      </div>

      <button class="submit" type="submit">Sign in</button>
    </form>

    <p class="note">No account yet? Your company's Finpulse admin can add you.</p>
  </main>

  <footer class="foot">
    <span>© 2026 Finpulse</span>
    <span class="links">
      <span>Privacy</span>
      <span>Terms</span>
      <span>Help</span>
    </span>
  </footer>

  <script src="../js/sign-in.js"></script>
</body>
</html>
